[project]
name = "bannerfont"
version = "1.0.0"
description = "Compile Minecraft banner SVGs into a COLRv1 colour font"
readme = "README.md"
requires-python = ">=3.11"

# Stage 2 (src/build_font.py) is pinned rather than floored because the pin is what makes a
# rebuild reproducible: fontTools decides the glyf outlines, the COLR paint structure and the
# palette packing, so a different version can change build/Font.ttf with no change in this repo.
#
# fonttools   builds every table.
# pillow      encodes the sbix bitmap strike (src/color_formats.py).
# brotli      lets fontTools write the woff2 web fonts (src/web_fonts.py).
#
# Verified: fonttools 4.57.0 also builds a byte-identical COLRv1 font, so relaxing that pin to
# `fonttools>=4.57` is safe if a newer pin ever becomes inconvenient.
dependencies = [
    "brotli==1.2.0",
    "fonttools==4.63.0",
    "pillow==13.0.0",
]

[tool.uv]
# This repo is an asset pipeline, not an installable library. Without this uv tries to
# build and install the project itself into the environment, which fails - there is no
# package to build, only the script at src/build_font.py.
package = false
